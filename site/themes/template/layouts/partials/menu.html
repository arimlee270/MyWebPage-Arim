<section class="menu menu-fix" id="menu">
  <nav>
    <!-- desktop-menu -->
    <div class="menu-container">
      <div class="desktop-menu-logo">
        <a href="{{ .Site.BaseURL | relLangURL }}"
          ><img
            class="img-fluid"
            src="{{ .Site.Params.logo_light | relURL }}"
            alt="{{ .Site.Title }}"
            id="desktop-logo"
        /></a>
      </div>
      <ul class="desktop-menu list-inline mb-0" id="desktop-menu">
        {{ range .Site.Menus.main }}
        <li class="menu-item hvr-underline-from-left {{ .Weight }}">
          <a href="{{ .URL }}">{{ .Name }}</a>
        </li>
        {{ end }}
      </ul>
      <!-- mobile-menu -->
      <div class="mobile-menu">
        <div class="mobile-menu-nav">
          <button
            type="button"
            class="menu-link"
            aria-label="모바일 메뉴 열기"
            aria-expanded="false"
            aria-controls="mobile-navigation"
          >
            <span></span>
            <span></span>
            <span></span>
          </button>
        </div>
        <div class="mobile-menu-logo">
          <a href="{{ .Site.BaseURL | relLangURL }}"
            ><img
              class="img-fluid"
              src="{{ .Site.Params.logo_dark | relURL }}"
              alt="{{ .Site.Title }}"
          /></a>
        </div>
        <div class="menu-slider" id="mobile-navigation">
          <nav>
            <ul class="mobile-menu-list">
              {{ range .Site.Menus.main }}
              <li class="mobile-menu-item 1 mx-auto">
                <a href="{{ .URL }}">{{ .Name }}</a>
              </li>
              {{ end }}
            </ul>
            <ul class="mobile-menu-icons list-inline mx-auto">
              {{ range .Site.Params.social }}
              {{ if .link }}
              <li>
                <a href="{{ .link | safeURL }}" target="_blank" rel="noreferrer" aria-label="{{ .alt }}"
                  ><i class="{{ .icon }} fa-2x" aria-hidden="true"></i
                ></a>
              </li>
              {{ end }}
              {{ end }}
            </ul>
          </nav>
        </div>
      </div>
      <button
        type="button"
        class="theme-toggle"
        id="theme-toggle"
        aria-label="다크 모드로 전환"
        aria-pressed="false"
        title="다크 모드로 전환"
      >
        <svg class="theme-toggle-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>
        </svg>
        <svg class="theme-toggle-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M20.4 15.2A8.5 8.5 0 0 1 8.8 3.6 8.6 8.6 0 1 0 20.4 15.2Z"></path>
        </svg>
      </button>
    </div>
  </nav>
</section>
