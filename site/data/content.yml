        ### 활동 소개

        인공지능 및 인간-AI 상호작용 분야의 연구를 공부하며 학부연구생으로 활동하고 있습니다.

        현재 관심 분야의 논문을 읽고 분석하며 연구 주제를 탐색하고 있습니다. 매주 논문 분석 내용을 랩미팅에서 발표하고 토론하며, 연구에서 해결하고자 하는 문제와 기존 연구의 한계를 이해하는 데 집중하고 있습니다.

        ### 주요 활동

        인공지능 및 인간-AI 상호작용 관련 논문 조사 및 분석

        논문의 문제 정의, 연구 방법, 실험 결과와 한계 정리

        정기 랩미팅에서 논문 분석 내용 발표 및 토론

        선행연구를 바탕으로 관심 연구 주제 탐색

        ### 배운 점 및 향후 계획

        논문을 단순히 읽는 것에서 나아가 연구의 문제 정의와 방법 선택의 이유를 이해하는 연습을 하고 있습니다.

        앞으로 다양한 선행연구를 비교·분석하며 관심 분야에 대한 이해를 넓히고, 구체적인 연구 주제를 선정하고자 합니다.

