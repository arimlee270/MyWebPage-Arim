portfolio:
  enable: true
  title: 'MY WORK'
  portfolio_list:
    - name: TastyTrip
      image: 'images/portfolio/tastytrip.png'
      url: ''
      github: 'https://github.com/arimlee270/tastytrip'
      demo: 'https://tastytrip.onrender.com'
      description: |
        **외국인 관광객을 위한 AI 기반 음식 정보 및 맞춤형 식당 추천 서비스**

        - **개발 기간:** 2026년 여름 ~ 9월
        - **담당 역할:** 팀장 - 서비스 기획, 시스템 설계, UI/UX 디자인, 프론트엔드 및 백엔드 개발, API 연동, 발표
        - **주요 성과:** AI & No-Code 해커톤 최우수상 수상, DRIVE 경진대회 본선 진출

        ### 프로젝트 소개

        TastyTrip은 한국을 방문한 외국인 관광객이 언어와 음식 문화의 차이로 겪는 어려움을 해결하기 위해 개발한 서비스입니다.

        메뉴판과 음식 사진을 AI로 분석해 음식의 재료와 특징을 설명하고, 사용자의 알레르기·종교·식단 제한 조건을 고려한 맞춤형 정보를 제공합니다. 또한 지도 기반 식당 검색과 추천 기능을 통해 사용자가 주변 식당을 탐색하고 자신에게 적합한 음식을 선택할 수 있도록 지원합니다.

        ### 담당 역할 및 팀 리딩

        팀장으로서 프로젝트의 방향을 설정하고 개발 과정을 총괄했습니다. 아이디어 기획부터 서비스 구조 설계, UI/UX 디자인, 핵심 기능 개발, 최종 발표까지 전 과정에 주도적으로 참여했습니다.

        React 기반 사용자 화면과 Express 서버를 개발하고, Gemini API와 공공데이터 API, Google Places API를 연동했습니다. 또한 Turso 데이터베이스를 활용하여 식당 및 음식 정보를 저장하고 재사용하는 구조와 사용자 조건을 반영한 맞춤형 추천 기능을 구현했습니다.

        프로젝트 진행 과정에서는 팀원들과 개발 방향을 조율하고 기능별 진행 상황을 관리했으며, 최종적으로 문제 정의와 구현 기능, 기술적 접근 방식 및 성과를 정리해 발표를 진행했습니다.

        ### 주요 구현 기능 및 사용 기술

        **1. AI 기반 메뉴판 및 음식 이미지 분석**

        Gemini API를 연동하여 메뉴판과 음식 사진에서 메뉴명, 재료, 음식의 특징 등을 분석하고 사용자에게 이해하기 쉬운 정보를 제공하도록 구현했습니다.

        **2. 공공데이터를 활용한 음식 정보 제공**

        식품의약품안전처(MFDS)와 USDA FoodData Central의 식품·영양 데이터를 활용하여 음식 관련 정보를 보완했습니다. 이를 통해 AI 분석 결과를 외부 데이터와 함께 활용하는 구조를 구성했습니다.

        **3. 지도 기반 식당 검색 및 추천**

        Google Places API를 연동하여 주변 식당의 위치, 평점, 영업 상태 등의 정보를 제공하는 지도 기능을 구현했습니다. 사용자는 지도에서 식당을 탐색하고 음식 정보를 함께 확인할 수 있습니다.

        **4. 식단 제한 조건을 고려한 맞춤형 추천**

        알레르기와 종교·식단 제한 조건을 우선 확인하는 규칙 기반 안전성 검사를 적용했습니다. 이후 필수 제약조건을 충족하는 후보를 대상으로 안전성, 거리, 정보 신뢰도 등을 가중합 방식으로 평가하여 추천 순위를 결정했습니다.

        **5. 데이터베이스 구축 및 분석 결과 재사용**

        React와 Express를 기반으로 서비스를 구성하고, Turso 데이터베이스에 식당·음식 정보와 메뉴 분석 결과를 저장했습니다. 이미 분석한 정보를 재사용하도록 설계하여 중복 AI API 호출을 줄이고 응답 효율을 개선했습니다.

        ### 개발 과정 및 기술적 의사결정

        개발 과정에서 가장 중요하게 고려한 것은 음식 정보의 신뢰성과 사용자 안전성이었습니다.

        AI가 생성한 정보만으로 알레르기나 식단 제한에 따른 음식의 적합성을 판단하기에는 한계가 있다고 생각했습니다. 이에 AI 이미지 분석, 공공데이터 활용, 규칙 기반 안전성 검사, 제약조건 기반 추천을 결합하는 방식을 선택했습니다.

        또한 메뉴 분석 결과를 데이터베이스에 저장하고 재사용함으로써 외부 API 호출에 따른 비용과 응답 지연을 줄이고자 했습니다.

        ### 프로젝트 결과

        2026년 여름 AI & No-Code 해커톤에서 최우수상을 수상했습니다. 이후 초기 서비스를 발전시켜 지도 기반 식당 탐색, 외부 API 연동, 데이터 저장 및 맞춤형 추천 기능 등을 구현했으며, DRIVE 경진대회 본선에 진출했습니다.

        ### 배운 점 및 향후 개선 방향

        이번 프로젝트를 통해 팀장으로서 프로젝트 전반을 이끌고, 실제 사용자의 문제를 정의하는 단계부터 서비스 설계, 프론트엔드와 백엔드 개발, 외부 API 및 데이터베이스 연동, 최종 발표까지 수행하는 경험을 쌓았습니다.

        특히 팀원들과 개발 방향을 조율하는 과정에서 협업과 의사소통의 중요성을 배웠으며, AI 모델에 공공데이터와 검증 규칙을 결합하는 것이 서비스의 신뢰성과 효율성을 높이는 데 중요하다는 점을 배웠습니다.

        향후에는 다양한 메뉴와 식당 데이터를 활용하여 분석 정확도와 추천 품질을 검증하고, 식단 제한 조건에 대한 정보의 신뢰성을 높이는 방향으로 개선하고자 합니다.

